# XcodeGen spec for the iOS player app. Generate the Xcode project on a Mac with:
#   brew install xcodegen && cd ios_version && xcodegen
# The build phase below compiles the shared Kotlin code into OsirisShared.framework.
name: Osiris
options:
  bundleIdPrefix: com.osiris
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Osiris:
    type: application
    platform: iOS
    sources:
      - Osiris/Sources
      # One copy of the fonts for both apps: the Android ones, copied into the bundle root.
      - path: ../android_version/app/src/main/res/font
        buildPhase: resources
    info:
      path: Osiris/Info.plist
      properties:
        CFBundleDisplayName: Osiris
        UILaunchScreen: {}
        # Manrope and Geist Mono (SIL OFL), registered at launch; Frost.swift sets their weights.
        UIAppFonts: [manrope.ttf, geist_mono.ttf]
        NSLocationWhenInUseUsageDescription: Osiris uses your location while you record a run, to verify the distance. Your route is never shown to other players.
        NSCameraUsageDescription: Osiris counts exercise reps with the camera. Images are analysed on this phone and never saved or uploaded.
        NSMotionUsageDescription: Osiris reads your step count and motion activity to check that runs and step challenges were done on foot.
        # osiris://challenge/<id>, osiris://invite/<token> (DeepLinkParser). Universal links for the
        # https invite pages need the Associated Domains entitlement, which needs the Apple team id.
        CFBundleURLTypes:
          - CFBundleURLName: com.osiris.player
            CFBundleURLSchemes: [osiris]
        UIBackgroundModes: [location]
        # Portrait only: the camera set and the run map are laid out for it, as on Android phones.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Dev builds call a backend on localhost over http; remote hosts stay HTTPS-only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osiris.player
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/presentation/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, OsirisShared, -lsqlite3]
    preBuildScripts:
      - name: Build OsirisShared (Kotlin)
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:presentation:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
