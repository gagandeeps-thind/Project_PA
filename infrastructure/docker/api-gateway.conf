# Reverse proxy and load balancer in front of the API (docker-compose.gateway.yml).
#
# Docker DNS returns one address per `backend` replica; nginx resolves the name when it starts
# and balances across them with least_conn. Restart the gateway after changing the replica count.
# Before running more than one replica read Documentation/Enterprise/17_Performance_Pass_and_Audit_2026-10-19.md
# ("Scaling out"): SQLite has one writer, the rate limiter is per process, and only one replica
# may run the background jobs (OSIRIS_RUN_SCHEDULER=0 on the others).

upstream osiris_api {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# WebSocket upgrade for the support chat (/api/v2/support/ws); plain requests keep the
# upstream connection alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8000;
    client_max_body_size 10m;

    # The API compresses its own JSON; compressing again here would only cost CPU.
    gzip off;

    location /api/v2/support/ws {
        proxy_pass http://osiris_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://osiris_api;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The API rate-limits per client IP; uvicorn reads it from here (FORWARDED_ALLOW_IPS).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
