server {
    listen 8080;
    root /usr/share/nginx/html;

    # Text assets compress 3-4x (the React chunk is 190 KB raw, 60 KB gzipped).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header in a location replaces the server-level set, so both locations declare it.
    # Hashed file names change on every build, so these can be cached forever, by browsers or a CDN.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Single-page app: unknown paths render index.html. It names the current asset hashes, so
    # it is revalidated on every load and a deploy shows at once.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
