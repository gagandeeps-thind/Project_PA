# Rendered at container start: the nginx image runs envsubst over /etc/nginx/templates/*.template and
# replaces only variables that exist in the environment, so ${API_ORIGIN} is filled in and nginx's own
# $uri is left alone. API_ORIGIN is the API URL the bundle was built with (admin.Dockerfile).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Text assets compress 3-4x (the React chunk is 190 KB raw, 60 KB gzipped). HTML is always
    # compressed. No brotli: this image ships without the module.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header in a location replaces the server-level set, so both locations declare theirs.
    # Hashed file names change on every build, so these can be cached forever, by browsers or a CDN.
    # A missing asset is a 404 here (not index.html), which the console reports as a stale deploy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Single-page app: unknown paths render index.html. It names the current asset hashes, so
    # it is revalidated on every load and a deploy shows at once.
    # The headers match the Render static site (render.yaml). In the CSP, the script hash is the one
    # inline handler that swaps in the web fonts (`this.media='all'` in index.html; change both
    # together) and connect-src is the API only. Browsers ignore HSTS over plain http (local compose).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri /index.html;
    }
}
