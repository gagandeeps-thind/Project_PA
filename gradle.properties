org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Kotlin/Native toolchain from Maven Central, and iOS klib compilation on Linux/Windows hosts
# (type-checks iosMain everywhere; linking the framework still needs macOS + Xcode).
kotlin.native.distribution.downloadFromMaven=true
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true
# Which config/environments/<name>.properties file is compiled into the apps (dev | staging | prod).
osiris.env=dev
