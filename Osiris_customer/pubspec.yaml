name: osiris_customer
description: "Osiris Customer - Player-facing fitness RPG app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_secure_storage: ^10.1.0
  sensors_plus: ^7.0.0
  camera: ^0.12.0+2
  google_mlkit_pose_detection: ^0.15.0
  sqflite: ^2.4.2+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/exercise_catalog.json
