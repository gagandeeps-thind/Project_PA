# Development: a backend running on the developer's machine (uvicorn main:app --host 0.0.0.0).
# Values are compiled into the shared core as com.osiris.shared.core.config.GeneratedEnv.
# Put machine-specific overrides in config/environments/local.properties (git-ignored), never in code.
environment=dev
# The Android emulator reaches the host machine at 10.0.2.2; the iOS simulator at localhost.
api.baseUrl.android=http://10.0.2.2:8000
api.baseUrl.ios=http://localhost:8000
api.baseUrl.jvm=http://localhost:8000
api.connectTimeoutMs=15000
api.requestTimeoutMs=15000
http.logging=true
features.legacy=false
features.poseRecording=true
# Host of the public share/invite pages (OSIRIS_PUBLIC_BASE_URL on the backend); its https links open the app.
links.webHost=localhost
