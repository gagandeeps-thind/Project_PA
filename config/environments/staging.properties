# Staging (SIT). Replace the host before the first staging build.
environment=staging
api.baseUrl.android=https://staging-api.osiris.example
api.baseUrl.ios=https://staging-api.osiris.example
api.baseUrl.jvm=https://staging-api.osiris.example
api.connectTimeoutMs=15000
api.requestTimeoutMs=20000
http.logging=false
features.legacy=false
features.poseRecording=true
# Host of the public share/invite pages (OSIRIS_PUBLIC_BASE_URL on the backend); its https links open the app.
links.webHost=staging.osiris.example
