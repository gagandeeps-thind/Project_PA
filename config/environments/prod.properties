# Production. Replace the host before the first release build.
environment=prod
api.baseUrl.android=https://api.osiris.example
api.baseUrl.ios=https://api.osiris.example
api.baseUrl.jvm=https://api.osiris.example
api.connectTimeoutMs=15000
api.requestTimeoutMs=20000
http.logging=false
features.legacy=false
# Pose recording collects movement data for QA; never in production builds.
features.poseRecording=false
