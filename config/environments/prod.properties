# Production: the live API on Render behind osiris.fit (docs/deployment/production.md).
environment=prod
api.baseUrl.android=https://api.osiris.fit
api.baseUrl.ios=https://api.osiris.fit
api.baseUrl.jvm=https://api.osiris.fit
api.connectTimeoutMs=15000
api.requestTimeoutMs=20000
http.logging=false
features.legacy=false
# Pose recording collects movement data for QA; never in production builds.
features.poseRecording=false
# Mock wallet (balances, methods, history); never in production builds.
features.walletDemo=false
# Host of the public share/invite pages (OSIRIS_PUBLIC_BASE_URL on the backend); its https links open the app.
# The API serves the /i/... and /join/... pages, so this must match OSIRIS_PUBLIC_BASE_URL's host.
links.webHost=api.osiris.fit
