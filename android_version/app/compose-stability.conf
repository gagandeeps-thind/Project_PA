com.osiris.shared.presentation.**
com.osiris.shared.domain.run.LatLng
com.osiris.shared.domain.exercise.ExerciseSpec
com.osiris.shared.domain.exercise.ExerciseCatalog
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
kotlin.time.Instant
kotlinx.datetime.LocalDate
